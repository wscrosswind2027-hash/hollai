<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Hall AI Ver.1.0</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--good:#047857;--warn:#b45309;--bad:#b42318;--soft:#f9fafb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 42px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:900}.badge{font-size:12px;background:#e5e7eb;padding:6px 9px;border-radius:999px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0}.tabs button{padding:11px 5px;font-size:12px}.tabs button.active{background:#111827;color:white}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.06)}button,input,select,textarea{font:inherit;width:100%}button{border:0;border-radius:13px;padding:13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e5e7eb}.ghost{background:#fff;border:1px solid var(--line)}.danger{color:var(--bad)}label{display:block;font-size:12px;font-weight:800;margin:11px 0 6px}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}textarea{min-height:160px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.muted{color:var(--muted);font-size:13px;line-height:1.65}.headline{font-size:27px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:5px}.rank,.knowledge{border-top:1px solid var(--line);padding:14px 0}.rank:first-child,.knowledge:first-child{border-top:0}.rankhead{display:flex;gap:10px;align-items:flex-start}.num{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.grow{flex:1}.machine{font-size:18px;font-weight:850}.score{font-size:13px;color:var(--good);font-weight:800}.reason{font-size:14px;line-height:1.65;margin-top:7px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#065f46;font-size:11px;font-weight:800;margin:5px 5px 0 0}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fef3f2;color:#b42318}.status{padding:11px 12px;border-radius:12px;background:#ecfdf5;color:#065f46;font-size:13px;font-weight:700;margin-top:10px}.status.warn{background:#fff7ed;color:#9a3412}.delta{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}.trend{font-weight:900}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--warn)}.sectiontitle{font-weight:900;margin-bottom:8px}.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:13px}.small{font-size:11px;color:var(--muted)}.decision{display:inline-block;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;margin-top:8px}.decision.go{background:#dcfce7;color:#166534}.decision.careful{background:#fef3c7;color:#92400e}.decision.watch{background:#ffedd5;color:#9a3412}.decision.stop{background:#fee2e2;color:#991b1b}.meter{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:7px 0}.meter>span{display:block;height:100%;background:#111827}.why{font-size:12px;color:var(--muted);line-height:1.55}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">Hall AI</div><div class="small">正式版・ローカルAI知識ビューア</div></div><div class="badge">Ver.1.0</div></div>
  <div class="tabs">
    <button class="active" data-tab="today">今日</button>
    <button data-tab="knowledge">癖カード</button>
    <button data-tab="dna">店舗DNA</button>
    <button data-tab="learning">学習</button>
    <button data-tab="update">更新</button>
    <button data-tab="memo">実戦メモ</button>
  </div>

  <section id="today">
    <div class="card">
      <div class="row">
        <div><label>店舗</label><select id="todayHall"></select></div>
        <div><label>イベント</label><select id="todayEvent"></select></div>
      </div>
      <label>日付</label><input id="todayDate" type="date">
      <button id="showToday" class="primary" style="margin-top:14px">最新の狙い目を表示</button>
      <div id="todayStatus" class="muted" style="margin-top:9px"></div>
    </div>
    <div id="todayResult" class="card hidden">
      <div class="small">AIの結論</div>
      <div id="todayHeadline" class="headline"></div>
      <div id="todayMeta" class="meta"></div>
      <div id="todayDecision"></div>
      <div id="todayReliability"></div>
      <div id="todayFactors"></div>
      <div id="todayRanks"></div>
      <div id="todayPlan" class="status"></div>
    </div>
  </section>

  <section id="knowledge" class="hidden">
    <div class="card">
      <div class="row">
        <div><label>店舗</label><select id="knowledgeHall"></select></div>
        <div><label>イベント</label><select id="knowledgeEvent"></select></div>
      </div>
      <div id="knowledgeList"></div>
    </div>
  </section>

  <section id="dna" class="hidden">
    <div class="card">
      <div class="sectiontitle">店舗DNA</div>
      <div class="muted">店舗ごとの営業傾向を数値化し、AIの期待値と信頼性へ反映します。</div>
      <label>店舗</label><select id="dnaHall"></select>
      <div id="dnaCard"></div>
    </div>
  </section>

  <section id="learning" class="hidden">
    <div class="card">
      <div class="sectiontitle">営業結果を登録</div>
      <div class="muted">予想と実際の強さを照合し、次回の期待値を少しずつ補正します。結果は0〜100点で入力してください。</div>
      <div class="row">
        <div><label>店舗</label><select id="learningHall"></select></div>
        <div><label>イベント</label><select id="learningEvent"></select></div>
      </div>
      <label>対象日</label><input id="learningDate" type="date">
      <label>機種</label><select id="learningMachine"></select>
      <div class="row">
        <div><label>実績点</label><input id="actualScore" type="number" min="0" max="100" placeholder="例：82"></div>
        <div><label>結果の確度</label><select id="resultConfidence"><option value="100">高い</option><option value="75">普通</option><option value="50">参考程度</option></select></div>
      </div>
      <label>外れ・的中理由</label><textarea id="resultReason" placeholder="例：並びは強かったが、本命機種ではなく隣の島に配分された。"></textarea>
      <button id="saveResult" class="primary" style="margin-top:10px">結果を保存して学習</button>
      <div id="learningStatus"></div>
    </div>
    <div class="card">
      <div class="sectiontitle">学習状況</div>
      <div id="learningSummary"></div>
    </div>
    <div class="card">
      <div class="sectiontitle">監査ログ</div>
      <div id="auditList"></div>
    </div>
  </section>

  <section id="update" class="hidden">
    <div class="card">
      <div class="sectiontitle">ChatGPTの更新データを貼り付け</div>
      <div class="muted">朝レポートの最後に表示された更新データをコピーし、ここへ貼り付けます。元サイトのデータを貼る必要はありません。</div>
      <textarea id="updateInput" placeholder='{"format":"HALL_AI_UPDATE_V2", ...}'></textarea>
      <button id="pasteBtn" class="ghost" style="margin-top:10px">クリップボードから貼り付け</button>
      <button id="previewBtn" class="secondary" style="margin-top:10px">更新内容を確認</button>
      <div id="previewBox"></div>
      <button id="applyBtn" class="primary hidden" style="margin-top:10px">確認した内容で更新</button>
      <div id="updateStatus"></div>
    </div>
    <div class="card">
      <div class="sectiontitle">データ管理</div>
      <button id="sampleBtn" class="secondary">Ver.1.0サンプルを登録</button>
      <button id="exportBtn" class="ghost" style="margin-top:9px">バックアップを書き出す</button>
      <label class="ghost" style="display:block;text-align:center;padding:13px;border-radius:13px;margin-top:9px;cursor:pointer">バックアップを復元<input id="restoreInput" type="file" accept="application/json" hidden></label>
      <button id="clearBtn" class="ghost danger" style="margin-top:9px">全データを削除</button>
    </div>
  </section>

  <section id="memo" class="hidden">
    <div class="card">
      <div class="sectiontitle">実戦で気付いたことを保存</div>
      <div class="row">
        <div><label>店舗</label><input id="memoHall" placeholder="例：ハイパーアロー美原"></div>
        <div><label>イベント</label><input id="memoEvent" placeholder="例：鬼黄取材2"></div>
      </div>
      <label>日付</label><input id="memoDate" type="date">
      <label>メモ</label><textarea id="memoText" placeholder="例：角より中央の並びが強かった。炎炎は全体的に稼働が高かった。"></textarea>
      <button id="saveMemo" class="primary" style="margin-top:10px">このメモを保存</button>
    </div>
    <div class="card"><div class="sectiontitle">保存済みメモ</div><div id="memoList"></div></div>
  </section>
  <div class="footer">予測は判断支援用です。結果を保証するものではありません。</div>
</div>
<script>
const KEY='hall-ai-ver1';
const LEGACY_KEYS=['hall-ai-ver1-rc5','hall-ai-ver1-rc4','hall-ai-ver1-rc3','hall-ai-ver1-rc2','hall-ai-ver1-rc1','hall-ai-knowledge-v5','hall-ai-free-v1'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const nowDate=()=>new Date().toISOString().slice(0,10);
function emptyState(){return {version:'1.0.0',predictions:[],knowledge:[],dna:[],results:[],learning:[],audit:[],decisionAudit:[],memos:[],updates:[],settings:{mode:'normal',goThreshold:75,watchThreshold:60}}}
function load(){try{return Object.assign(emptyState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return emptyState()}}
let state=load(), pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function trendClass(v){return v==='up'?'up':v==='down'?'down':'flat'}
function trendLabel(v){return v==='up'?'上昇':v==='down'?'下降':'横ばい'}
function stars(score){const n=Math.max(1,Math.min(5,Math.round(Number(score||0)/20)));return '★'.repeat(n)+'☆'.repeat(5-n)}
function uniq(a){return [...new Set(a.filter(Boolean))]}
function migrateOld(){
  if(state.predictions.length||state.knowledge.length)return;
  for(const key of LEGACY_KEYS){
    try{
      const raw=JSON.parse(localStorage.getItem(key)||'null');
      if(!raw)continue;
      if(Array.isArray(raw))state.predictions=raw;
      else state=Object.assign(emptyState(),raw,{version:'1.0.0',dna:Array.isArray(raw.dna)?raw.dna:[],results:Array.isArray(raw.results)?raw.results:[],learning:Array.isArray(raw.learning)?raw.learning:[],audit:Array.isArray(raw.audit)?raw.audit:[],decisionAudit:Array.isArray(raw.decisionAudit)?raw.decisionAudit:[],settings:Object.assign(emptyState().settings,raw.settings||{})});
      save();break;
    }catch{}
  }
}
function normalizeUpdate(raw){
  if(!isPlainObject(raw))throw new Error('JSONの最上位はオブジェクトである必要があります');
  if(!['HALL_AI_UPDATE_V2','HALL_AI_UPDATE_V3'].includes(raw.format))throw new Error('更新形式がHALL_AI_UPDATE_V2/V3ではありません');
  const hall=safeText(raw.hall,120),event=safeText(raw.event,120),updated_at=safeText(raw.updated_at,40);
  if(!hall||!event||!updated_at)throw new Error('店舗・イベント・更新日時が不足しています');
  if(!validDateLike(updated_at))throw new Error('更新日時の形式が不正です');
  if(raw.prediction!=null&&!isPlainObject(raw.prediction))throw new Error('predictionの形式が不正です');
  if(raw.hall_dna!=null&&!isPlainObject(raw.hall_dna))throw new Error('hall_dnaの形式が不正です');
  const knowledge=(Array.isArray(raw.knowledge)?raw.knowledge:[]).filter(isPlainObject).slice(0,200).map(k=>({
    ...k,machine:safeText(k.machine,120),score:clamp(k.score),confidence:clamp(k.confidence),trend:['up','down','flat'].includes(k.trend)?k.trend:'flat',
    reasons:(Array.isArray(k.reasons)?k.reasons:[]).map(x=>safeText(x,300)).filter(Boolean).slice(0,20),
    ai_note:safeText(k.ai_note,800),evidence:isPlainObject(k.evidence)?k.evidence:{}
  })).filter(k=>k.machine);
  return {
    format:raw.format,hall,event,updated_at,
    prediction:raw.prediction||null,
    knowledge,
    notes:(Array.isArray(raw.notes)?raw.notes:[]).map(x=>safeText(x,500)).filter(Boolean).slice(0,50),
    source_summary:safeText(raw.source_summary,1000),
    hall_dna:raw.hall_dna||null
  };
}
function applyUpdate(u){
  if(u.prediction){
    const p={...u.prediction,hall:u.hall,event:u.event,updated_at:u.updated_at,date:u.prediction.date||u.updated_at.slice(0,10)};
    const i=state.predictions.findIndex(x=>x.hall===p.hall&&x.event===p.event&&x.date===p.date);
    i>=0?state.predictions[i]=p:state.predictions.push(p);
  }
  for(const k0 of u.knowledge){
    const k={hall:u.hall,event:u.event,machine:String(k0.machine||''),score:Number(k0.score||0),confidence:Number(k0.confidence||0),trend:k0.trend||'flat',reasons:Array.isArray(k0.reasons)?k0.reasons:[],evidence:k0.evidence||{},updated_at:u.updated_at,ai_note:k0.ai_note||''};
    if(!k.machine)continue;
    const i=state.knowledge.findIndex(x=>x.hall===k.hall&&x.event===k.event&&x.machine===k.machine);
    if(i>=0){
      const old=state.knowledge[i];
      const history=Array.isArray(old.history)?old.history:[];
      history.push({date:old.updated_at,score:old.score,confidence:old.confidence});
      k.history=history.slice(-12);
      state.knowledge[i]=k;
    }else{k.history=[];state.knowledge.push(k)}
  }
  if(u.hall_dna){
    const d={hall:u.hall,updated_at:u.updated_at,
      new_machine_focus:clamp(u.hall_dna.new_machine_focus),
      main_machine_focus:clamp(u.hall_dna.main_machine_focus),
      lineup_focus:clamp(u.hall_dna.lineup_focus),
      corner_focus:clamp(u.hall_dna.corner_focus),
      event_loyalty:clamp(u.hall_dna.event_loyalty),
      variety_focus:clamp(u.hall_dna.variety_focus),
      stability:clamp(u.hall_dna.stability),
      confidence:clamp(u.hall_dna.confidence),
      notes:Array.isArray(u.hall_dna.notes)?u.hall_dna.notes:[]};
    const i=state.dna.findIndex(x=>x.hall===u.hall);
    if(i>=0)state.dna[i]=d;else state.dna.push(d);
  }
  for(const n of u.notes){
    state.memos.unshift({id:Date.now()+Math.random(),hall:u.hall,event:u.event,date:u.updated_at.slice(0,10),text:String(n),type:'ai'});
  }
  state.updates.unshift({hall:u.hall,event:u.event,updated_at:u.updated_at,count:u.knowledge.length,source_summary:u.source_summary});
  state.updates=state.updates.slice(0,50);
  save();refreshAll();
}
function refreshSelectors(){
  const halls=uniq([...state.predictions.map(x=>x.hall),...state.knowledge.map(x=>x.hall),...state.dna.map(x=>x.hall),...state.memos.map(x=>x.hall)]);
  for(const id of ['todayHall','knowledgeHall','dnaHall','learningHall']){
    const el=$(id),prev=el.value;el.innerHTML=(halls.length?halls:['ハイパーアロー美原']).map(x=>`<option>${esc(x)}</option>`).join('');if(halls.includes(prev))el.value=prev;
  }
  refreshEvents('today');refreshEvents('knowledge');refreshEvents('learning');renderDNA();
}
function refreshEvents(mode){
  const hall=$(mode+'Hall').value;
  const events=uniq([...state.predictions.filter(x=>x.hall===hall).map(x=>x.event),...state.knowledge.filter(x=>x.hall===hall).map(x=>x.event)]);
  const el=$(mode+'Event'),prev=el.value;el.innerHTML=(events.length?events:['鬼黄取材2']).map(x=>`<option>${esc(x)}</option>`).join('');if(events.includes(prev))el.value=prev;
  if(mode==='knowledge')renderKnowledge();
  if(mode==='learning')refreshLearningMachines();
}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,Number(n)||0))}

function isPlainObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v)}
function safeText(v,max=500){return String(v??'').trim().slice(0,max)}
function validDateLike(v){return !Number.isNaN(new Date(v).getTime())}
function dedupeBy(arr,keyFn){const seen=new Set();return arr.filter(x=>{const k=keyFn(x);if(seen.has(k))return false;seen.add(k);return true})}
function sanitizeState(raw){
  if(!isPlainObject(raw))throw new Error('バックアップの最上位形式が不正です');
  const clean=emptyState();
  clean.version='1.0-rc5';
  for(const key of ['predictions','knowledge','dna','results','learning','audit','decisionAudit','memos','updates'])clean[key]=Array.isArray(raw[key])?raw[key]:[];
  clean.settings=Object.assign(emptyState().settings,isPlainObject(raw.settings)?raw.settings:{});
  clean.settings.goThreshold=clamp(clean.settings.goThreshold,50,95);
  clean.settings.watchThreshold=clamp(clean.settings.watchThreshold,30,90);
  if(clean.settings.watchThreshold>=clean.settings.goThreshold)clean.settings.watchThreshold=clean.settings.goThreshold-10;
  clean.predictions=dedupeBy(clean.predictions.filter(x=>isPlainObject(x)&&safeText(x.hall)&&safeText(x.event)),x=>`${x.hall}|${x.event}|${x.date||x.updated_at||''}`);
  clean.knowledge=dedupeBy(clean.knowledge.filter(x=>isPlainObject(x)&&safeText(x.hall)&&safeText(x.event)&&safeText(x.machine)),x=>`${x.hall}|${x.event}|${x.machine}`);
  clean.dna=dedupeBy(clean.dna.filter(x=>isPlainObject(x)&&safeText(x.hall)),x=>x.hall);
  clean.results=dedupeBy(clean.results.filter(x=>isPlainObject(x)&&safeText(x.hall)&&safeText(x.event)&&safeText(x.machine)),x=>x.id||`${x.hall}|${x.event}|${x.date}|${x.machine}|${x.actual}`);
  clean.memos=clean.memos.filter(x=>isPlainObject(x)&&safeText(x.text)).slice(0,500);
  clean.audit=clean.audit.filter(isPlainObject).slice(0,500);
  clean.learning=clean.learning.filter(x=>isPlainObject(x)&&safeText(x.hall)&&safeText(x.event)&&safeText(x.machine));
  clean.updates=clean.updates.filter(isPlainObject).slice(0,100);
  return clean;
}
function resultKey(hall,event,date,machine){return `${hall}|${event}|${date}|${machine}`}
function modeAdjustment(){const m=state.settings?.mode||'normal';return m==='cautious'?6:m==='attack'?-5:0}
function calculateDecision(p,hall,event){
  const cards=state.knowledge.filter(x=>x.hall===hall&&x.event===event).sort((a,b)=>b.score-a.score);
  const top=cards[0];
  const rankTop=(p.rankings||[])[0]||{};
  const base=clamp(p.expectation ?? top?.score ?? rankTop.confidence ?? 0);
  const learned=state.learning.find(x=>x.hall===hall&&x.event===event&&x.machine===(top?.machine||rankTop.machine||''));
  const learningBonus=Math.round(Number(learned?.adjustment||0));
  const sample=Number(top?.evidence?.sample_size||0);
  const hitRate=clamp(top?.evidence?.hit_rate||0);
  const sampleFactor=clamp(sample*5,0,100);
  const confidence=clamp(top?.confidence ?? rankTop.confidence ?? 0);
  const freshnessDays=top?.updated_at?Math.max(0,(Date.now()-new Date(top.updated_at).getTime())/86400000):365;
  const freshness=clamp(100-freshnessDays*1.2);
  const dna=state.dna.find(x=>x.hall===hall);
  const dnaConfidence=clamp(dna?.confidence||0);
  const dnaStability=clamp(dna?.stability||0);
  const dnaEventFit=clamp(dna?.event_loyalty||0);
  const dnaBonus=dna?Math.round((dnaEventFit-50)*0.12):0;
  const recentTrend=top?.trend==='up'?6:top?.trend==='down'?-7:0;
  const primary=clamp(base+dnaBonus+learningBonus+recentTrend);
  const conservative=Math.round(clamp(base*.55+confidence*.20+hitRate*.10+dnaEventFit*.08+freshness*.07));
  const disagreement=Math.abs(primary-conservative);
  const reliability=Math.round(confidence*.36+sampleFactor*.18+freshness*.14+dnaConfidence*.10+dnaStability*.10+hitRate*.12);
  const dataAdequacy=Math.round(sampleFactor*.45+freshness*.25+dnaConfidence*.15+Math.min(100,Number(learned?.samples||0)*12)*.15);
  const unknownPattern=dataAdequacy<35||(!top&&!(p.rankings||[]).length);
  const vetoReasons=[];
  if(unknownPattern)vetoReasons.push('未知パターンまたはデータ不足');
  if(freshness<35)vetoReasons.push('データが古すぎる');
  if(dna&&dnaStability<25)vetoReasons.push('営業傾向が大きく不安定');
  if(disagreement>=25)vetoReasons.push('主判断と慎重判断の差が大きい');
  const finalScore=Math.round(primary*.68+conservative*.32);
  const adj=modeAdjustment();
  const go=(state.settings?.goThreshold||75)+adj, watch=(state.settings?.watchThreshold||60)+adj;
  let label='撤退',cls='stop';
  if(vetoReasons.length){label=finalScore>=go?'GO（慎重）':'様子見';cls=finalScore>=go?'careful':'watch'}
  else if(finalScore>=go&&reliability>=60){label='GO';cls='go'}
  else if(finalScore>=go){label='GO（慎重）';cls='careful'}
  else if(finalScore>=watch){label='様子見';cls='watch'}
  const reasons=[];
  if(reliability<50)reasons.push('根拠データがまだ薄い');
  if(freshness<65)reasons.push('データ鮮度が低下');
  if(sample<5)reasons.push('類似サンプル不足');
  if(top?.trend==='down')reasons.push('直近トレンド下降');
  if(dna&&dnaEventFit>=70)reasons.push('店舗DNAとイベント傾向が一致');
  if(dna&&dnaStability<45)reasons.push('店舗傾向が不安定');
  if(learningBonus)reasons.push(`自己学習補正 ${learningBonus>0?'+':''}${learningBonus}点`);
  reasons.push(...vetoReasons.map(x=>'警戒：'+x));
  if(!reasons.length)reasons.push('期待値・信頼性とも基準内');
  const factors=[
    {name:'基礎期待値',value:base,impact:base>=70?'強':'中'},
    {name:'店舗DNA',value:dnaEventFit,impact:`${dnaBonus>0?'+':''}${dnaBonus}点`},
    {name:'自己学習',value:clamp(50+learningBonus*5),impact:`${learningBonus>0?'+':''}${learningBonus}点`},
    {name:'直近傾向',value:top?.trend==='up'?80:top?.trend==='down'?30:55,impact:`${recentTrend>0?'+':''}${recentTrend}点`},
    {name:'データ充足度',value:dataAdequacy,impact:`${dataAdequacy}%`}
  ];
  return {expectation:finalScore,primary,conservative,disagreement,baseExpectation:base,dnaBonus,learningBonus,reliability,dataAdequacy,label,cls,reasons,factors,unknownPattern};
}

function dnaLabel(v){return v>=80?'非常に強い':v>=65?'強い':v>=45?'中立':v>=30?'弱い':'非常に弱い'}

  if(!d){$('dnaCard').innerHTML='<div class="empty">この店舗のDNAはまだ登録されていません。</div>';return}

}

function refreshLearningMachines(){
  const hall=$('learningHall')?.value,event=$('learningEvent')?.value;
  if(!hall||!event||!$('learningMachine'))return;
  const machines=uniq([
    ...state.knowledge.filter(x=>x.hall===hall&&x.event===event).map(x=>x.machine),
    ...state.predictions.filter(x=>x.hall===hall&&x.event===event).flatMap(x=>(x.rankings||[]).map(r=>r.machine))
  ]);
  const prev=$('learningMachine').value;
  $('learningMachine').innerHTML=(machines.length?machines:['対象機種未登録']).map(x=>`<option>${esc(x)}</option>`).join('');
  if(machines.includes(prev))$('learningMachine').value=prev;
}
function predictedScoreFor(hall,event,date,machine){
  let p=state.predictions.find(x=>x.hall===hall&&x.event===event&&x.date===date);
  if(!p)p=state.predictions.filter(x=>x.hall===hall&&x.event===event).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)))[0];
  const card=state.knowledge.find(x=>x.hall===hall&&x.event===event&&x.machine===machine);
  const rank=(p?.rankings||[]).find(x=>x.machine===machine);
  return clamp(card?.score ?? rank?.confidence ?? p?.expectation ?? 0);
}
function registerLearningResult(){
  const hall=$('learningHall').value,event=$('learningEvent').value,date=$('learningDate').value||nowDate(),machine=$('learningMachine').value;
  const actual=Number($('actualScore').value),certainty=clamp($('resultConfidence').value),reason=$('resultReason').value.trim();
  if(!machine||machine==='対象機種未登録')return alert('学習対象の機種がありません');
  if(!Number.isFinite(actual)||actual<0||actual>100)return alert('実績点は0〜100で入力してください');
  const duplicate=state.results.find(x=>resultKey(x.hall,x.event,x.date,x.machine)===resultKey(hall,event,date,machine));
  if(duplicate&&!confirm('同じ店舗・イベント・日付・機種の結果が既にあります。置き換えて再学習しますか？'))return;
  if(duplicate){
    state.results=state.results.filter(x=>x!==duplicate);
    state.audit.unshift({id:Date.now(),date:new Date().toISOString(),hall,event,machine,type:'warning',message:'重複結果を置き換えました。既存学習値は保持されます。',reason:''});
  }
  const predicted=predictedScoreFor(hall,event,date,machine);
  const error=actual-predicted;
  const step=Math.max(-3,Math.min(3,error*0.08*(certainty/100)));
  let l=state.learning.find(x=>x.hall===hall&&x.event===event&&x.machine===machine);
  if(!l){l={hall,event,machine,adjustment:0,samples:0,mae:0,hit_rate:0,updated_at:''};state.learning.push(l)}
  const oldSamples=Number(l.samples||0);
  l.samples=oldSamples+1;
  l.mae=Math.round(((Number(l.mae||0)*oldSamples)+Math.abs(error))/l.samples*10)/10;
  const hit=Math.abs(error)<=15?1:0;
  l.hit_rate=Math.round((((Number(l.hit_rate||0)/100)*oldSamples+hit)/l.samples)*100);
  l.adjustment=Math.round(Math.max(-10,Math.min(10,Number(l.adjustment||0)+step))*10)/10;
  l.updated_at=new Date().toISOString();
  const result={id:Date.now(),hall,event,date,machine,predicted,actual,certainty,error:Math.round(error),reason,adjustment_after:l.adjustment,created_at:l.updated_at};
  state.results.unshift(result);state.results=state.results.slice(0,300);
  state.audit.unshift({id:Date.now()+1,date:l.updated_at,hall,event,machine,type:'learning',message:`予想${predicted}点／実績${actual}点。補正を${l.adjustment>0?'+':''}${l.adjustment}点へ更新。`,reason});
  state.audit=state.audit.slice(0,200);
  save();renderLearning();$('actualScore').value='';$('resultReason').value='';
  $('learningStatus').innerHTML=`<div class="status">学習完了：誤差 ${error>0?'+':''}${Math.round(error)}点／次回補正 ${l.adjustment>0?'+':''}${l.adjustment}点</div>`;
}
function renderLearning(){
  if(!$('learningSummary'))return;
  const hall=$('learningHall').value,event=$('learningEvent').value;
  const items=state.learning.filter(x=>x.hall===hall&&x.event===event).sort((a,b)=>b.samples-a.samples);
  $('learningSummary').innerHTML=items.length?items.map(x=>`<div class="knowledge"><div class="machine">${esc(x.machine)}</div><div><span class="pill">補正 ${x.adjustment>0?'+':''}${x.adjustment}点</span><span class="pill">学習 ${x.samples}回</span><span class="pill ${x.hit_rate<50?'warn':''}">一致率 ${x.hit_rate}%</span></div><div class="small">平均誤差 ${x.mae}点・更新 ${esc(x.updated_at||'-')}</div></div>`).join(''):'<div class="empty">この条件の学習履歴はまだありません。</div>';
  const logs=state.audit.filter(x=>!hall||x.hall===hall).slice(0,30);
  $('auditList').innerHTML=logs.length?logs.map(x=>`<div class="knowledge"><b>${esc(x.machine||x.hall)}</b><div class="small">${esc(x.date)}｜${esc(x.event||'')}</div><div class="reason">${esc(x.message)}</div>${x.reason?`<div class="delta">理由：${esc(x.reason)}</div>`:''}</div>`).join(''):'<div class="empty">監査ログはまだありません。</div>';
}
