<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Hall AI</title><style>
:root{--bg:#0b1020;--card:#151c2f;--card2:#1d2740;--text:#f8fafc;--muted:#a7b0c0;--accent:#22c55e;--line:#2b3858}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08101f,#101729);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:16px 14px 96px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:22px;margin:0}.ver,.muted{color:var(--muted)}.ver{font-size:12px}.card{background:#151c2f;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.status{display:flex;align-items:center;gap:12px}.badge{font-weight:800;border-radius:999px;padding:8px 13px;background:#334155}.badge.go{background:#166534}.badge.stop{background:#991b1b}.badge.caution{background:#92400e}.score{font-size:40px;font-weight:900}.targets{display:grid;gap:10px;margin-top:12px}.target{background:var(--card2);border-radius:14px;padding:13px;border:1px solid #344263}.rank{font-weight:900;color:#86efac;margin-right:8px}h2{font-size:17px;margin:0 0 10px}ul{padding-left:20px}li{margin:6px 0}.kv{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}textarea{width:100%;min-height:260px;background:#070d19;color:#e5e7eb;border:1px solid #334155;border-radius:13px;padding:12px;font:13px/1.55 monospace}button{border:0;border-radius:13px;padding:13px 15px;font-weight:800;font-size:15px}.primary{background:var(--accent);color:#052e16;width:100%}.secondary{background:#334155;color:white}.danger{background:#7f1d1d;color:white}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{flex:1}.msg{margin-top:10px;padding:10px 12px;border-radius:12px;display:none}.msg.ok{display:block;background:#14532d}.msg.err{display:block;background:#7f1d1d}details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0}summary{padding:15px;font-weight:800}.inner{padding:0 15px 15px}nav{position:fixed;left:0;right:0;bottom:0;background:#070c18;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px}nav .wrap{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}nav button{background:#1e293b;color:#cbd5e1;padding:10px 6px;font-size:13px}nav button.active{background:#2563eb;color:white}.page{display:none}.page.active{display:block}.empty{text-align:center;padding:42px 18px;color:var(--muted)}.small{font-size:12px}
</style></head><body><div class="app"><header><h1>🎯 Hall AI</h1><div class="ver">Clean Edition 1.0</div></header><section id="home" class="page active"><div id="homeContent"></div></section><section id="detail" class="page"><div id="detailContent"></div></section><section id="update" class="page"><div class="card"><h2>ChatGPT同期データ</h2><p class="muted">JSONをそのまま貼り付けてください。</p><textarea id="jsonInput"></textarea><button class="primary" id="importBtn">更新する</button><div id="message" class="msg"></div></div><div class="card"><h2>データ管理</h2><div class="row"><button class="secondary" id="exportBtn">バックアップ保存</button><button class="danger" id="clearBtn">保存データを消去</button></div></div></section></div><nav><div class="wrap"><button data-page="home" class="active">今日の狙い</button><button data-page="detail">理由・詳細</button><button data-page="update">更新</button></div></nav><script>
(()=>{const KEY="hall-ai-clean-v1",$=id=>document.getElementById(id);const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch{return null}};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));function normalize(r){if(!r||typeof r!=="object")throw Error("JSON形式が正しくありません。");if(!["HALL_AI_UPDATE_V2","HALL_AI_UPDATE_V3","HALL_AI_UPDATE_V4"].includes(r.format))throw Error("対応形式はV2/V3/V4です。");const p=r.prediction||{};return{format:r.format,hall:r.hall||"店舗未設定",event:r.event||"イベント未設定",updated_at:r.updated_at||new Date().toISOString(),prediction:{go:typeof p.go==="boolean"?p.go:null,score:isFinite(Number(p.score))?Number(p.score):null,confidence:isFinite(Number(p.confidence))?Number(p.confidence):null,summary:p.summary||"",targets:Array.isArray(p.targets)?p.targets:[],avoid:Array.isArray(p.avoid)?p.avoid:[],strategy:p.strategy||"",tails:Array.isArray(p.tails)?p.tails:[],rows:Array.isArray(p.rows)?p.rows:[],positions:Array.isArray(p.positions)?p.positions:[]},knowledge:Array.isArray(r.knowledge)?r.knowledge:[],hall_dna:r.hall_dna&&typeof r.hall_dna==="object"?r.hall_dna:{},notes:r.notes||""}}function render(){const d=get();if(!d){$("homeContent").innerHTML='<div class="card empty"><h2>まだ予測データがありません</h2><p>「更新」から同期データを貼り付けてください。</p></div>';$("detailContent").innerHTML='<div class="card empty">データ更新後に詳細が表示されます。</div>';return}const p=d.prediction||{},status=p.go===true?["GO","go"]:p.go===false?["見送り","stop"]:["慎重","caution"];const targets=(p.targets||[]).map((x,i)=>`<div class="target"><span class="rank">${i+1}位</span>${esc(x)}</div>`).join("")||'<div class="muted">登録なし</div>';$("homeContent").innerHTML=`<div class="card"><div class="muted">${esc(d.hall)}</div><h2 style="font-size:20px;margin-top:5px">${esc(d.event)}</h2><div class="status"><span class="badge ${status[1]}">${status[0]}</span>${p.score!==null?`<div><span class="score">${p.score}</span><span class="muted"> /100</span></div>`:""}</div>${p.summary?`<p>${esc(p.summary)}</p>`:""}${p.confidence!==null?`<div class="muted">予測信頼度：${p.confidence}%</div>`:""}</div><div class="card"><h2>本日の狙い機種</h2><div class="targets">${targets}</div></div>${p.strategy?`<div class="card"><h2>立ち回り</h2><p>${esc(p.strategy)}</p></div>`:""}<div class="muted small" style="text-align:center">最終更新：${esc(new Date(d.updated_at).toLocaleString("ja-JP"))}</div>`;const list=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>登録なし</li>";const dna=Object.entries(d.hall_dna||{}).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("")||'<div class="muted">登録なし</div>';$("detailContent").innerHTML=`<details open><summary>予測理由</summary><div class="inner"><ul>${list(d.knowledge)}</ul></div></details><details><summary>避けたい条件・危険台</summary><div class="inner"><ul>${list(p.avoid)}</ul></div></details><details><summary>狙い末尾</summary><div class="inner"><ul>${list(p.tails)}</ul></div></details><details><summary>狙い列</summary><div class="inner"><ul>${list(p.rows)}</ul></div></details><details><summary>狙い位置</summary><div class="inner"><ul>${list(p.positions)}</ul></div></details><details><summary>店舗DNA</summary><div class="inner">${dna}</div></details>${d.notes?`<details><summary>補足メモ</summary><div class="inner"><p>${esc(d.notes)}</p></div></details>`:""}`}function msg(t,ok){const e=$("message");e.className="msg "+(ok?"ok":"err");e.textContent=t}$("importBtn").onclick=()=>{try{const d=normalize(JSON.parse($("jsonInput").value.trim()));localStorage.setItem(KEY,JSON.stringify(d));msg("更新成功。『今日の狙い』に反映しました。",true);render()}catch(e){msg("更新できませんでした："+e.message,false)}};$("clearBtn").onclick=()=>{if(confirm("保存データを消去しますか？")){localStorage.removeItem(KEY);$("jsonInput").value="";msg("保存データを消去しました。",true);render()}};$("exportBtn").onclick=()=>{const d=get();if(!d)return msg("保存データがありません。",false);const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hall-ai-backup.json";a.click();URL.revokeObjectURL(a.href)};document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));$(b.dataset.page).classList.add("active");b.classList.add("active");scrollTo(0,0)});render()})();</script></body></html>
