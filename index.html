<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Hall AI</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
:root{--bg:#0d1016;--card:#171b24;--card2:#202633;--text:#f7f8fb;--muted:#aeb7c6;--accent:#9b5cff;--accent2:#4cc9f0;--good:#30d158;--border:#2c3442}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d1016,#111621 55%,#0d1016);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding:18px 14px 105px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:24px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted)}.status{font-size:12px;color:var(--good);background:rgba(48,209,88,.12);padding:6px 9px;border-radius:999px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px}.card h2{font-size:16px;margin:0 0 14px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:14px;padding:13px 14px;font-size:16px}textarea{min-height:180px;font-family:monospace;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700}.primary{width:100%;color:#fff;background:linear-gradient(135deg,var(--accent),#6e5cff);margin-top:14px}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.danger{background:rgba(255,69,58,.14);color:#ff8b84;border:1px solid rgba(255,69,58,.35)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(155,92,255,.2),rgba(76,201,240,.12));border:1px solid rgba(155,92,255,.35)}.hero .title{font-size:18px;font-weight:800}.hero .meta{font-size:12px;color:var(--muted);margin-top:6px}.rank{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}.rank:last-child{border-bottom:0}.num{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900}.rbody{flex:1}.machine{font-size:17px;font-weight:800}.reason{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}.confidence{font-size:12px;padding:5px 8px;border-radius:999px;background:rgba(48,209,88,.12);color:var(--good)}.empty{text-align:center;color:var(--muted);padding:28px 10px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,22,.97);border-top:1px solid var(--border);display:flex;justify-content:center}.tabs-inner{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr 1fr}.tab{background:transparent;color:var(--muted);padding:12px 8px}.tab.active{color:white}.tab span{display:block;font-size:21px}.view{display:none}.view.active{display:block}.notice{font-size:12px;color:var(--muted);line-height:1.6}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">🎰</div><div><h1>Hall AI</h1><div class="sub">今日の狙い目をスマホで確認</div></div></div><div class="status">端末内保存</div></header>
<section id="todayView" class="view active">
<div class="card"><h2>今日の条件</h2><label>店舗</label><select id="storeSelect"></select><div class="grid"><div><label>日付</label><input id="dateInput" type="date"></div><div><label>イベント</label><select id="eventSelect"></select></div></div><button class="primary" id="predictBtn">今日の狙い目を表示</button></div>
<div id="resultArea"><div class="card empty">まだ予測データがありません。<br>「ChatGPTから更新」からデータを登録してください。</div></div>
</section>
<section id="importView" class="view"><div class="card"><h2>ChatGPTから更新</h2><p class="notice">ChatGPTが作ったJSONを貼り付けて保存します。</p><textarea id="jsonInput" placeholder='{"store":"ハイパーアロー美原","date":"2026-07-20","event":"鬼黄取材2","headline":"本日の狙い目","recommendations":[{"machine":"L炎炎ノ消防隊2","confidence":82,"reason":"過去傾向を評価"}]}'></textarea><div class="toolbar" style="margin-top:10px"><button class="primary" id="saveJsonBtn" style="flex:1;margin:0">予測データを保存</button><button class="secondary" id="sampleBtn">見本</button></div></div></section>
<section id="settingsView" class="view"><div class="card"><h2>保存データ</h2><div id="stats" class="notice"></div><div class="toolbar" style="margin-top:14px"><button class="secondary" id="backupBtn">バックアップ</button><button class="danger" id="clearBtn">全データ削除</button></div></div></section>
</main>
<nav class="tabs"><div class="tabs-inner"><button class="tab active" data-view="todayView"><span>🏠</span>今日</button><button class="tab" data-view="importView"><span>🤖</span>ChatGPTから更新</button><button class="tab" data-view="settingsView"><span>⚙️</span>設定</button></div></nav>
<script>
const KEY='hall_ai_predictions_v1';let predictions=JSON.parse(localStorage.getItem(KEY)||'[]');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uniq=a=>[...new Set(a.filter(Boolean))];const today=()=>new Date().toISOString().slice(0,10);function refresh(){let s=uniq(predictions.map(x=>x.store)),e=uniq(predictions.map(x=>x.event));$('#storeSelect').innerHTML=s.length?s.map(x=>`<option>${esc(x)}</option>`).join(''):'<option>データなし</option>';$('#eventSelect').innerHTML=e.length?e.map(x=>`<option>${esc(x)}</option>`).join(''):'<option>データなし</option>';$('#stats').innerHTML=`保存中の予測：<b>${predictions.length}件</b>`}function save(){localStorage.setItem(KEY,JSON.stringify(predictions));refresh()}function render(x){if(!x){$('#resultArea').innerHTML='<div class="card empty">一致する予測がありません。</div>';return}let r=Array.isArray(x.recommendations)?x.recommendations:[];$('#resultArea').innerHTML=`<div class="card"><div class="hero"><div class="title">${esc(x.headline||'本日の狙い目')}</div><div class="meta">${esc(x.store)} / ${esc(x.date)} / ${esc(x.event)}</div></div>${r.map((v,i)=>`<div class="rank"><div class="num">${i+1}</div><div class="rbody"><div class="machine">${esc(v.machine||'候補機種')}</div><div class="reason">${esc(v.reason||'')}</div></div><div class="confidence">${Number(v.confidence||0)}%</div></div>`).join('')}</div>`}$('#dateInput').value=today();$('#predictBtn').onclick=()=>render(predictions.find(x=>x.store===$('#storeSelect').value&&x.date===$('#dateInput').value&&x.event===$('#eventSelect').value));$('#saveJsonBtn').onclick=()=>{try{let d=JSON.parse($('#jsonInput').value),arr=Array.isArray(d)?d:[d];arr.forEach(x=>{if(!x.store||!x.date||!x.event)throw Error('store・date・eventが必要です');let i=predictions.findIndex(y=>y.store===x.store&&y.date===x.date&&y.event===x.event);i>=0?predictions[i]=x:predictions.push(x)});save();alert('保存しました')}catch(e){alert('保存できませんでした\n'+e.message)}};$('#sampleBtn').onclick=()=>$('#jsonInput').value=JSON.stringify({store:'ハイパーアロー美原',date:today(),event:'鬼黄取材2',headline:'メイン機種を軸にした狙い',recommendations:[{machine:'L炎炎ノ消防隊2',confidence:84,reason:'イベント傾向と設置比率を評価'},{machine:'スマスロ北斗の拳',confidence:76,reason:'メイン島の投入期待'}]},null,2);$('#clearBtn').onclick=()=>{if(confirm('全データを削除しますか？')){predictions=[];save();render(null)}};$('#backupBtn').onclick=()=>{let b=new Blob([JSON.stringify(predictions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hall-ai-backup.json';a.click()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')});refresh();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body></html>
