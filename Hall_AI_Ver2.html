<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Hall AI Ver.2.0</title>
<style>
:root{--bg:#080d18;--card:#121a2a;--card2:#182236;--line:#29364f;--text:#f3f7ff;--muted:#a8b3c7;--accent:#6d5dfc;--accent2:#36c5f0;--good:#31d17c;--warn:#ffbf3f;--bad:#ff667a;--shadow:0 18px 50px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1a2140 0,#080d18 42%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:16px 14px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}h1{font-size:23px;margin:0}.small{font-size:12px;color:var(--muted)}.badge{padding:7px 10px;border-radius:999px;background:rgba(49,209,124,.12);color:var(--good);font-weight:800;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;top:0;z-index:10;padding:8px 0;background:rgba(8,13,24,.94);backdrop-filter:blur(12px)}button,input,select,textarea{font:inherit}.tab,button{border:0;border-radius:13px;padding:12px;font-weight:800;cursor:pointer}.tab{background:var(--card2);color:var(--muted);font-size:12px}.tab.active,.primary{background:linear-gradient(135deg,var(--accent),#5141d7);color:#fff}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.danger{color:var(--bad)}.view{display:none}.view.active{display:block}.card{background:rgba(18,26,42,.97);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:10px 0 6px}select,input,textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:12px}textarea{min-height:180px;resize:vertical}.section{font-size:16px;font-weight:900;margin-bottom:9px}.hero{padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(109,93,252,.22),rgba(54,197,240,.11));border:1px solid rgba(109,93,252,.4)}.headline{font-size:24px;font-weight:950}.meta{font-size:12px;color:var(--muted);margin-top:5px}.decision{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:950;margin-top:10px}.go{background:rgba(49,209,124,.16);color:var(--good)}.care{background:rgba(255,191,63,.16);color:var(--warn)}.stop{background:rgba(255,102,122,.16);color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}.rank{display:flex;gap:11px;padding:14px 0;border-top:1px solid var(--line)}.rank:first-child{border-top:0}.rankno{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:950}.grow{flex:1}.machine{font-size:17px;font-weight:900}.reason{font-size:13px;color:#d5dbea;line-height:1.65;margin-top:6px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(54,197,240,.12);color:#78dbf7;font-size:11px;font-weight:800;margin:5px 4px 0 0}.tag.warn{background:rgba(255,191,63,.14);color:var(--warn)}.tag.bad{background:rgba(255,102,122,.14);color:var(--bad)}.panel{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.bar{height:8px;border-radius:999px;background:#263149;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.status{padding:11px 12px;border-radius:12px;margin-top:10px;font-size:13px;background:rgba(49,209,124,.12);color:var(--good)}.status.warn{background:rgba(255,191,63,.12);color:var(--warn)}.empty{text-align:center;color:var(--muted);padding:22px 4px}.history{padding:12px 0;border-top:1px solid var(--line)}.history:first-child{border-top:0}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand"><div class="logo">🎰</div><div><h1>Hall AI</h1><div class="small">ChatGPT連携・店舗癖学習ツール</div></div></div><div class="badge">Ver.2.0</div></div>
<div class="tabs">
<button class="tab active" data-view="dashboard">今日</button><button class="tab" data-view="live">実戦</button><button class="tab" data-view="learn">学習</button><button class="tab" data-view="sync">同期</button><button class="tab" data-view="dna">DNA</button><button class="tab" data-view="cards">癖カード</button><button class="tab" data-view="history">履歴</button><button class="tab" data-view="settings">設定</button>
</div>
<section id="dashboard" class="view active">
<div class="card"><div class="grid2"><div><label>店舗</label><select id="dashHall"></select></div><div><label>イベント</label><select id="dashEvent"></select></div></div><label>対象日</label><input id="dashDate" type="date"><button id="showDash" class="primary" style="width:100%;margin-top:12px">最新予測を表示</button><div id="dashCount" class="small" style="margin-top:8px"></div></div>
<div id="dashResult"></div>
</section>
<section id="live" class="view"><div class="card"><div class="section">実戦モード</div><div class="grid2"><div><label>店舗</label><select id="liveHall"></select></div><div><label>イベント</label><select id="liveEvent"></select></div></div><label>抽選番号</label><input id="lottery" type="number" placeholder="例：78"><label>現場状況</label><textarea id="liveMemo" placeholder="例：北斗満席、モンキー半分空き、炎炎の島は高稼働"></textarea><button id="judgeLive" class="primary" style="width:100%;margin-top:10px">現場判断を表示</button><button id="saveLive" class="secondary" style="width:100%;margin-top:8px">実戦メモを保存</button><div id="liveResult"></div></div></section>
<section id="learn" class="view"><div class="card"><div class="section">営業結果を登録</div><div class="grid2"><div><label>店舗</label><select id="learnHall"></select></div><div><label>イベント</label><select id="learnEvent"></select></div></div><label>日付</label><input id="learnDate" type="date"><label>機種</label><select id="learnMachine"></select><div class="grid2"><div><label>実績点 0〜100</label><input id="actual" type="number" min="0" max="100"></div><div><label>結果の確度</label><select id="certainty"><option value="100">高い</option><option value="75">普通</option><option value="50">参考</option></select></div></div><label>理由</label><textarea id="learnReason" placeholder="外れ・的中理由を入力"></textarea><button id="saveLearning" class="primary" style="width:100%;margin-top:10px">保存して学習</button><div id="learnStatus"></div></div><div class="card"><div class="section">学習状況</div><div id="learnSummary"></div></div></section>
<section id="sync" class="view"><div class="card"><div class="section">ChatGPT同期</div><div class="small">HALL_AI_UPDATE_V4を推奨。旧V2/V3も取り込めます。</div><textarea id="syncInput" placeholder='{"format":"HALL_AI_UPDATE_V4", ...}'></textarea><button id="paste" class="secondary" style="width:100%;margin-top:8px">クリップボードから貼り付け</button><button id="preview" class="secondary" style="width:100%;margin-top:8px">更新内容を確認</button><div id="previewBox"></div><button id="apply" class="primary" style="width:100%;margin-top:8px;display:none">この内容で更新</button><div id="syncStatus"></div></div><div class="card"><button id="sample" class="secondary" style="width:100%">V4サンプルを表示</button></div></section>
<section id="dna" class="view"><div class="card"><div class="section">店舗DNA</div><label>店舗</label><select id="dnaHall"></select><div id="dnaBox"></div></div></section>
<section id="cards" class="view"><div class="card"><div class="section">癖カード</div><div class="grid2"><div><label>店舗</label><select id="cardHall"></select></div><div><label>イベント</label><select id="cardEvent"></select></div></div><div id="cardBox"></div></div></section>
<section id="history" class="view"><div class="card"><div class="section">同期・実戦履歴</div><div id="historyBox"></div></div></section>
<section id="settings" class="view"><div class="card"><div class="section">データ管理</div><button id="export" class="secondary" style="width:100%">バックアップを書き出す</button><label class="secondary" style="display:block;text-align:center;padding:12px;border-radius:13px;margin-top:9px;cursor:pointer">バックアップを復元<input id="restore" type="file" accept="application/json" hidden></label><button id="clear" class="secondary danger" style="width:100%;margin-top:9px">全データを削除</button><div id="stats" class="panel"></div></div></section>
<div class="footer">予測は判断支援用です。結果を保証するものではありません。</div>
</div>
<script>
const KEY='hall-ai-ver2'; const OLD='hall-ai-ver1'; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const today=()=>new Date().toISOString().slice(0,10); const clamp=n=>Math.max(0,Math.min(100,Number(n)||0)); const uniq=a=>[...new Set(a.filter(Boolean))];
function blank(){return{version:'2.0.0',predictions:[],knowledge:[],dna:[],learning:[],results:[],updates:[],liveLogs:[],memos:[],settings:{go:75,watch:60}}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return blank()}}
let state=load(),pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function migrate(){if(state.predictions.length||state.knowledge.length)return;try{const o=JSON.parse(localStorage.getItem(OLD)||'null');if(!o)return;state.predictions=o.predictions||[];state.knowledge=o.knowledge||[];state.dna=o.dna||[];state.learning=o.learning||[];state.results=o.results||[];state.memos=o.memos||[];state.updates=o.updates||[];save()}catch{}}
function norm(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('JSON最上位が不正です');if(!['HALL_AI_UPDATE_V2','HALL_AI_UPDATE_V3','HALL_AI_UPDATE_V4'].includes(raw.format))throw Error('V2/V3/V4形式ではありません');if(!raw.hall||!raw.event||!raw.updated_at)throw Error('店舗・イベント・更新日時が不足しています');const p=raw.prediction||null;return{format:raw.format,hall:String(raw.hall),event:String(raw.event),updated_at:String(raw.updated_at),source_summary:String(raw.source_summary||''),prediction:p?{...p,date:p.date||String(raw.updated_at).slice(0,10),rankings:Array.isArray(p.rankings)?p.rankings:[],strategy:p.strategy||raw.strategy||{},patterns:p.patterns||raw.patterns||{},risk_flags:p.risk_flags||raw.risk_flags||[],data_quality:p.data_quality||raw.data_quality||{}}:null,knowledge:(Array.isArray(raw.knowledge)?raw.knowledge:[]).filter(x=>x&&x.machine).map(x=>({...x,score:clamp(x.score),confidence:clamp(x.confidence),trend:['up','down','flat'].includes(x.trend)?x.trend:'flat'})),hall_dna:raw.hall_dna||null,notes:Array.isArray(raw.notes)?raw.notes:[]}}
function applyUpdate(u){if(u.prediction){const p={...u.prediction,hall:u.hall,event:u.event,updated_at:u.updated_at};const i=state.predictions.findIndex(x=>x.hall===p.hall&&x.event===p.event&&x.date===p.date);i>=0?state.predictions[i]=p:state.predictions.push(p)}u.knowledge.forEach(k=>{const x={...k,hall:u.hall,event:u.event,updated_at:u.updated_at,reasons:Array.isArray(k.reasons)?k.reasons:[],evidence:k.evidence||{},ai_note:k.ai_note||''};const i=state.knowledge.findIndex(y=>y.hall===x.hall&&y.event===x.event&&y.machine===x.machine);if(i>=0){x.history=[...(state.knowledge[i].history||[]),{date:state.knowledge[i].updated_at,score:state.knowledge[i].score}].slice(-12);state.knowledge[i]=x}else{x.history=[];state.knowledge.push(x)}});if(u.hall_dna){const d={hall:u.hall,updated_at:u.updated_at,...u.hall_dna};const i=state.dna.findIndex(x=>x.hall===u.hall);i>=0?state.dna[i]=d:state.dna.push(d)}u.notes.forEach(n=>state.memos.unshift({date:u.updated_at.slice(0,10),hall:u.hall,event:u.event,text:String(n),type:'ai'}));state.updates.unshift({hall:u.hall,event:u.event,updated_at:u.updated_at,count:u.knowledge.length,format:u.format,source_summary:u.source_summary});state.updates=state.updates.slice(0,100);save();refreshAll()}
function halls(){return uniq([...state.predictions.map(x=>x.hall),...state.knowledge.map(x=>x.hall),...state.dna.map(x=>x.hall),...state.liveLogs.map(x=>x.hall)])}
function events(h){return uniq([...state.predictions.filter(x=>x.hall===h).map(x=>x.event),...state.knowledge.filter(x=>x.hall===h).map(x=>x.event)])}
function fillSelect(id,arr,fallback){const e=$(id),prev=e.value;e.innerHTML=(arr.length?arr:[fallback]).map(x=>`<option>${esc(x)}</option>`).join('');if(arr.includes(prev))e.value=prev}
function refreshSelectors(){const hs=halls();['dashHall','liveHall','learnHall','dnaHall','cardHall'].forEach(id=>fillSelect(id,hs,'ハイパーアロー美原'));refreshEvents('dash');refreshEvents('live');refreshEvents('learn');refreshEvents('card')}
function refreshEvents(prefix){const h=$(prefix+'Hall').value;fillSelect(prefix+'Event',events(h),'超乱舞のリアル（アツ姫取材）');if(prefix==='learn')refreshMachines();if(prefix==='card')renderCards()}
function latestPrediction(h,e,d){return state.predictions.find(x=>x.hall===h&&x.event===e&&x.date===d)||state.predictions.filter(x=>x.hall===h&&x.event===e).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)))[0]}
function decision(p,h,e){const cards=state.knowledge.filter(x=>x.hall===h&&x.event===e).sort((a,b)=>b.score-a.score),top=cards[0],dna=state.dna.find(x=>x.hall===h),base=clamp(p.expectation??top?.score??p.rankings?.[0]?.confidence),conf=clamp(top?.confidence??p.data_quality?.confidence??p.rankings?.[0]?.confidence),sample=Number(top?.evidence?.sample_size||p.data_quality?.sample_size||0),hit=clamp(top?.evidence?.hit_rate||0),fresh=top?.updated_at?clamp(100-(Date.now()-new Date(top.updated_at))/86400000*1.2):40,dnaFit=clamp(dna?.event_loyalty||50),learn=state.learning.find(x=>x.hall===h&&x.event===e&&x.machine===(top?.machine||p.rankings?.[0]?.machine)),bonus=Number(learn?.adjustment||0),score=Math.round(clamp(base+(dnaFit-50)*.1+bonus+(top?.trend==='up'?5:top?.trend==='down'?-6:0))),rel=Math.round(clamp(conf*.42+Math.min(100,sample*6)*.2+fresh*.15+dnaFit*.13+hit*.1)),label=score>=75&&rel>=60?'GO':score>=75?'GO（慎重）':score>=60?'様子見':'撤退';return{score,rel,label,cls:label==='GO'?'go':label==='撤退'?'stop':'care',data:Math.round(clamp(Math.min(100,sample*6)*.55+fresh*.25+(dna?.confidence||0)*.2)),dnaFit}}
function renderDash(){const h=$('dashHall').value,e=$('dashEvent').value,d=$('dashDate').value,p=latestPrediction(h,e,d);$('dashCount').textContent=`予測 ${state.predictions.length}件・癖カード ${state.knowledge.length}件`;if(!p){$('dashResult').innerHTML='<div class="card empty">予測がありません。同期タブから更新データを取り込んでください。</div>';return}const j=decision(p,h,e),r=p.rankings||[],st=p.strategy||{},pt=p.patterns||{},risks=p.risk_flags||[],dq=p.data_quality||{};$('dashResult').innerHTML=`<div class="card"><div class="hero"><div class="small">AIの結論</div><div class="headline">${esc(p.headline||'最新予測')}</div><div class="meta">${esc(h)}｜${esc(e)}｜${esc(p.date)}｜更新 ${esc(p.updated_at||'-')}</div><div class="decision ${j.cls}">${j.label}</div><div class="metrics"><div class="metric"><b>${j.score}</b><span>期待値</span></div><div class="metric"><b>${j.rel}%</b><span>AI信頼性</span></div><div class="metric"><b>${j.data}%</b><span>データ充足度</span></div><div class="metric"><b>${j.dnaFit}%</b><span>DNA一致</span></div></div></div>${r.map((x,i)=>`<div class="rank"><div class="rankno">${i+1}</div><div class="grow"><div class="machine">${esc(x.symbol||(['◎','○','▲','△'][i]||'・'))} ${esc(x.machine)}</div><span class="tag">信頼度 ${clamp(x.confidence)}%</span><div class="reason">${(x.reasons||[]).map(y=>'・'+esc(y)).join('<br>')}</div></div></div>`).join('')||'<div class="empty">候補機種なし</div>'}<div class="panel"><b>抽選番号別戦略</b><div class="reason">良番：${esc(st.good_lottery||st.goodLottery||'上位候補を優先')}<br>中番：${esc(st.normal_lottery||st.normalLottery||'島状況を確認')}<br>悪番：${esc(st.bad_lottery||st.badLottery||'後ヅモまたは撤退')}</div></div><div class="panel"><b>狙いパターン</b><div>${Object.entries(pt).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('')||'<span class="small">未登録</span>'}</div></div>${risks.length?`<div class="panel"><b>危険・撤退条件</b><div class="reason">${risks.map(x=>'・'+esc(typeof x==='string'?x:(x.reason||x.name||JSON.stringify(x)))).join('<br>')}</div></div>`:''}<div class="panel"><b>データ品質</b><div class="reason">信頼度 ${clamp(dq.confidence||j.rel)}%・サンプル ${Number(dq.sample_size||0)}件<br>${esc(dq.note||'')}</div></div><div class="status">${esc(p.plan||'現場状況を見て、無理な着席は避ける。')}</div></div>`}
function liveJudge(){const h=$('liveHall').value,e=$('liveEvent').value,p=latestPrediction(h,e,today());if(!p){$('liveResult').innerHTML='<div class="status warn">予測データがありません。</div>';return}const n=Number($('lottery').value||999),s=p.strategy||{},base=decision(p,h,e);let text=n<=30?(s.good_lottery||s.goodLottery||'本命を優先'):n<=100?(s.normal_lottery||s.normalLottery||'対抗と島状況を確認'):(s.bad_lottery||s.badLottery||'無理に座らず後ヅモへ');const memo=$('liveMemo').value;const weak=/弱い|空き多|低稼働|撤退/.test(memo),strong=/満席|高稼働|強い|良さそう/.test(memo);let adj=strong?5:weak?-8:0;$('liveResult').innerHTML=`<div class="status ${adj<0?'warn':''}"><b>${base.label}</b>・現場補正 ${adj>0?'+':''}${adj}点<br>${esc(text)}<br><span class="small">入力内容は自動解析の補助であり、最終判断は現場優先。</span></div>`}
function saveLive(){const x={id:Date.now(),date:new Date().toISOString(),hall:$('liveHall').value,event:$('liveEvent').value,lottery:Number($('lottery').value||0),text:$('liveMemo').value.trim()};if(!x.text)return alert('現場状況を入力してください');state.liveLogs.unshift(x);state.liveLogs=state.liveLogs.slice(0,200);save();renderHistory();$('liveResult').innerHTML='<div class="status">実戦メモを保存しました。</div>'}
function refreshMachines(){const h=$('learnHall').value,e=$('learnEvent').value;fillSelect('learnMachine',uniq([...state.knowledge.filter(x=>x.hall===h&&x.event===e).map(x=>x.machine),...state.predictions.filter(x=>x.hall===h&&x.event===e).flatMap(x=>(x.rankings||[]).map(r=>r.machine))]),'対象機種未登録')}
function saveLearning(){const h=$('learnHall').value,e=$('learnEvent').value,m=$('learnMachine').value,a=Number($('actual').value),c=clamp($('certainty').value);if(!Number.isFinite(a)||a<0||a>100)return alert('実績点を0〜100で入力してください');const p=latestPrediction(h,e,$('learnDate').value),card=state.knowledge.find(x=>x.hall===h&&x.event===e&&x.machine===m),rank=p?.rankings?.find(x=>x.machine===m),pred=clamp(card?.score??rank?.confidence??p?.expectation),err=a-pred,step=Math.max(-3,Math.min(3,err*.08*(c/100)));let l=state.learning.find(x=>x.hall===h&&x.event===e&&x.machine===m);if(!l){l={hall:h,event:e,machine:m,samples:0,adjustment:0,mae:0,hit_rate:0};state.learning.push(l)}const old=l.samples;l.samples++;l.mae=Math.round(((l.mae*old)+Math.abs(err))/l.samples*10)/10;l.hit_rate=Math.round((((l.hit_rate/100)*old+(Math.abs(err)<=15?1:0))/l.samples)*100);l.adjustment=Math.round(Math.max(-10,Math.min(10,l.adjustment+step))*10)/10;l.updated_at=new Date().toISOString();state.results.unshift({date:l.updated_at,hall:h,event:e,machine:m,predicted:pred,actual:a,error:Math.round(err),reason:$('learnReason').value});save();renderLearning();$('learnStatus').innerHTML=`<div class="status">学習完了：誤差 ${err>0?'+':''}${Math.round(err)}点／次回補正 ${l.adjustment>0?'+':''}${l.adjustment}点</div>`}
function renderLearning(){const h=$('learnHall').value,e=$('learnEvent').value,a=state.learning.filter(x=>x.hall===h&&x.event===e);$('learnSummary').innerHTML=a.length?a.map(x=>`<div class="history"><b>${esc(x.machine)}</b><div><span class="tag">補正 ${x.adjustment>0?'+':''}${x.adjustment}</span><span class="tag">${x.samples}回</span><span class="tag">一致率 ${x.hit_rate}%</span></div><div class="small">平均誤差 ${x.mae}点</div></div>`).join(''):'<div class="empty">学習履歴なし</div>'}
function renderDNA(){const h=$('dnaHall').value,d=state.dna.find(x=>x.hall===h);if(!d){$('dnaBox').innerHTML='<div class="empty">DNA未登録</div>';return}const ignore=['hall','updated_at','notes'];const rows=Object.entries(d).filter(([k,v])=>!ignore.includes(k)&&typeof v==='number');$('dnaBox').innerHTML=rows.map(([k,v])=>`<div class="history"><div style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span>${clamp(v)}点</span></div><div class="bar"><span style="width:${clamp(v)}%"></span></div></div>`).join('')+`<div class="status">${(d.notes||[]).map(x=>'・'+esc(x)).join('<br>')||'メモなし'}</div><div class="small">更新 ${esc(d.updated_at||'-')}</div>`}
function renderCards(){const h=$('cardHall').value,e=$('cardEvent').value,a=state.knowledge.filter(x=>x.hall===h&&x.event===e).sort((a,b)=>b.score-a.score);$('cardBox').innerHTML=a.length?a.map(x=>`<div class="history"><div class="machine">${esc(x.machine)}</div><span class="tag">${x.score}点</span><span class="tag">信頼度 ${x.confidence}%</span><span class="tag ${x.trend==='down'?'bad':x.trend==='flat'?'warn':''}">${x.trend}</span><div class="reason">${(x.reasons||[]).map(y=>'・'+esc(y)).join('<br>')}</div>${x.ai_note?`<div class="panel">${esc(x.ai_note)}</div>`:''}</div>`).join(''):'<div class="empty">癖カードなし</div>'}
function renderHistory(){const a=[...state.updates.map(x=>({...x,type:'同期'})),...state.liveLogs.map(x=>({...x,type:'実戦'}))].sort((a,b)=>String(b.updated_at||b.date).localeCompare(String(a.updated_at||a.date))).slice(0,80);$('historyBox').innerHTML=a.length?a.map(x=>`<div class="history"><b>${esc(x.type)}｜${esc(x.hall)}｜${esc(x.event)}</b><div class="small">${esc(x.updated_at||x.date)}</div><div class="reason">${esc(x.source_summary||x.text||'')}</div></div>`).join(''):'<div class="empty">履歴なし</div>'}
function refreshStats(){$('stats').innerHTML=`予測 ${state.predictions.length}件<br>癖カード ${state.knowledge.length}件<br>店舗DNA ${state.dna.length}件<br>学習結果 ${state.results.length}件<br>実戦メモ ${state.liveLogs.length}件`}
function refreshAll(){refreshSelectors();renderDash();renderDNA();renderCards();renderLearning();renderHistory();refreshStats()}
$('showDash').onclick=renderDash;$('judgeLive').onclick=liveJudge;$('saveLive').onclick=saveLive;$('saveLearning').onclick=saveLearning;$('preview').onclick=()=>{try{pending=norm(JSON.parse($('syncInput').value.trim()));$('previewBox').innerHTML=`<div class="status">${esc(pending.hall)}／${esc(pending.event)}<br>予測 ${pending.prediction?'あり':'なし'}・癖カード ${pending.knowledge.length}件・DNA ${pending.hall_dna?'あり':'なし'}</div>`;$('apply').style.display='block';$('syncStatus').innerHTML=''}catch(e){pending=null;$('apply').style.display='none';$('syncStatus').innerHTML=`<div class="status warn">確認できません：${esc(e.message)}</div>`}};$('apply').onclick=()=>{if(pending){applyUpdate(pending);pending=null;$('apply').style.display='none';$('syncStatus').innerHTML='<div class="status">更新完了。今日・DNA・癖カードへ反映しました。</div>'}};$('paste').onclick=async()=>{try{$('syncInput').value=await navigator.clipboard.readText()}catch{alert('入力欄を長押しして貼り付けてください')}};
$('sample').onclick=()=>{$('syncInput').value=JSON.stringify({format:'HALL_AI_UPDATE_V4',hall:'ハイパーアロー美原',event:'超乱舞のリアル（アツ姫取材）',updated_at:new Date().toISOString(),source_summary:'公開結果・イベント傾向・店舗履歴を統合',hall_dna:{new_machine_focus:72,main_machine_focus:86,lineup_focus:84,corner_focus:38,event_loyalty:78,variety_focus:45,stability:70,confidence:72,notes:['メイン機種と並びを重視']},prediction:{date:today(),headline:'北斗・モンキーを中心に並びを確認',expectation:78,rankings:[{symbol:'◎',machine:'スマスロ北斗の拳',confidence:80,reasons:['主力機種','並び候補']},{symbol:'○',machine:'モンキーターンV',confidence:74,reasons:['対抗候補']},{symbol:'▲',machine:'からくりサーカス',confidence:66,reasons:['島状況次第']}],plan:'良番は本命、悪番は島状況確認後に後ヅモへ。',strategy:{good_lottery:'1〜30番は本命を優先',normal_lottery:'31〜100番は対抗と並び確認',bad_lottery:'101番以降は無理に座らず後ヅモ'},patterns:{lineup:84,corner:38,tail:'未確定'},risk_flags:['本命島の稼働が低い場合は撤退','単品挙動だけで追わない'],data_quality:{confidence:72,sample_size:9,note:'イベント固有サンプルはまだ少ない'}},knowledge:[{machine:'スマスロ北斗の拳',score:80,confidence:78,trend:'up',reasons:['主力扱い','並び候補'],evidence:{sample_size:9,hit_rate:64},ai_note:'島全体の挙動を確認'}],notes:['角より並びを優先する。']},null,2)};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`hall-ai-ver2-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};$('restore').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());state=Object.assign(blank(),x);save();refreshAll();alert('復元しました')}catch{alert('復元できませんでした')}};$('clear').onclick=()=>{if(confirm('全データを削除しますか？')){state=blank();save();refreshAll()}};
['dash','live','learn','card'].forEach(p=>{$(p+'Hall').onchange=()=>refreshEvents(p);$(p+'Event').onchange=()=>{if(p==='learn')refreshMachines();if(p==='card')renderCards()}});$('dnaHall').onchange=renderDNA;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));if(b.dataset.view==='dna')renderDNA();if(b.dataset.view==='cards')renderCards();if(b.dataset.view==='learn')renderLearning();if(b.dataset.view==='history')renderHistory();if(b.dataset.view==='settings')refreshStats()});
$('dashDate').value=today();$('learnDate').value=today();migrate();refreshAll();
</script></body></html>
